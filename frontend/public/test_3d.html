<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3D Burger Test</title>
  <style>
    body { margin: 0; background: #140E0A; display: flex; flex-direction: column; align-items: center; }
    canvas { width: 600px; height: 500px; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script type="module">
    import * as THREE from '/node_modules/three/build/three.module.js';
    import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 600 / 500, 0.1, 1000);
    camera.position.set(0, 0.5, 3.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(600, 500);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.getElementById('container').appendChild(renderer.domElement);

    // Warm atmospheric lighting matching the boho evening wall
    const ambientLight = new THREE.AmbientLight(0xffeedd, 1.2);
    scene.add(ambientLight);

    const topLamp = new THREE.DirectionalLight(0xffb74d, 2.5); // warm amber lamp
    topLamp.position.set(0, 5, 2);
    scene.add(topLamp);

    const leftCandle = new THREE.PointLight(0xff9800, 2.0, 10);
    leftCandle.position.set(-2, 0.5, 1);
    scene.add(leftCandle);

    const rightCandle = new THREE.PointLight(0xff9800, 2.0, 10);
    rightCandle.position.set(2, 0.5, 1);
    scene.add(rightCandle);

    const loader = new GLTFLoader();
    
    // Test model 1: hamburger__food_big-hamburger.glb
    const modelUrl = new URLSearchParams(window.location.search).get('m') || 'hamburger__food_big-hamburger.glb';
    loader.load('/models/' + modelUrl, (gltf) => {
      const model = gltf.scene;
      
      // Auto-center and normalize size
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 1.8 / maxDim;
      model.scale.setScalar(scale);
      
      model.position.x = -center.x * scale;
      model.position.y = -center.y * scale - 0.1;
      model.position.z = -center.z * scale;
      
      // Gentle tilt for appetizing angle
      model.rotation.x = 0.2;
      model.rotation.y = -0.3;

      scene.add(model);
      window.__MODEL_LOADED = true;
      renderer.render(scene, camera);
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
